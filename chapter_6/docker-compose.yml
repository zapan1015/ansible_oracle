services:
  # 1. Ansible Control Node
  ansible-control:
    build:
      context: ./docker
      dockerfile: Dockerfile.control
    container_name: ansible-control-ch6
    hostname: ansible-control
    user: oracle
    working_dir: /home/oracle/ansible-oracle-project
    environment:
      - ANSIBLE_CONFIG=/home/oracle/ansible-oracle-project/ansible.cfg
      - ANSIBLE_CFG_IN_WORLD_WRITABLE_DIR=1
    volumes:
      - ./ansible-oracle-project:/home/oracle/ansible-oracle-project
      - shared-ssh-keys-ch6:/home/oracle/.ssh
    networks:
      ansible-net-ch6:
        ipv4_address: 192.168.6.10
    command: >
      bash -c "
        mkdir -p /home/oracle/.ssh &&
        if [ ! -f /home/oracle/.ssh/id_rsa ]; then
          ssh-keygen -t rsa -b 4096 -f /home/oracle/.ssh/id_rsa -N '' -q;
          chmod 600 /home/oracle/.ssh/id_rsa;
          chmod 644 /home/oracle/.ssh/id_rsa.pub;
        fi;
        chmod 755 /home/oracle/ansible-oracle-project || true;
        echo 'Chapter 6 Ansible Control Node is ready.';
        tail -f /dev/null
      "

  # 2. Oracle Server 1 (db01)
  db01:
    build:
      context: ./docker
      dockerfile: Dockerfile.oracle_node
    container_name: db01
    hostname: db01
    networks:
      ansible-net-ch6:
        ipv4_address: 192.168.6.101
    volumes:
      - shared-ssh-keys-ch6:/shared-keys:ro

  # 3. Oracle Server 2 (db02)
  db02:
    build:
      context: ./docker
      dockerfile: Dockerfile.oracle_node
    container_name: db02
    hostname: db02
    networks:
      ansible-net-ch6:
        ipv4_address: 192.168.6.102
    volumes:
      - shared-ssh-keys-ch6:/shared-keys:ro

networks:
  ansible-net-ch6:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.6.0/24
          gateway: 192.168.6.1

volumes:
  shared-ssh-keys-ch6:
