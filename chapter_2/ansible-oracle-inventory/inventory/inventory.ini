# ========================================================
# Oracle DBA Master Inventory (INI Format - Chapter 2)
# Production-grade Hierarchical Structure with Environments
# ========================================================

[all:children]
dev
test
prod
database_infrastructure

# --------------------------------------------------------
# Environment Parent Groups (자식 그룹 포함)
# --------------------------------------------------------
[dev:children]
dev_db_servers
dev_grid_servers
dev_dataguard_servers

[test:children]
test_db_servers

[prod:children]
prod_db_servers
prod_grid_servers
prod_rac_nodes

[database_infrastructure:children]
db_servers
grid_servers
rac_nodes
dataguard_servers

[db_servers:children]
dev_db_servers
test_db_servers
prod_db_servers

[grid_servers:children]
dev_grid_servers
prod_grid_servers

[rac_nodes:children]
prod_rac_nodes

[dataguard_servers:children]
dev_dataguard_servers

# --------------------------------------------------------
# Host Endpoints Definition
# --------------------------------------------------------
[dev_db_servers]
devdb01   ansible_host=192.168.1.101 db_name=devdb   oracle_sid=DEVDB1

[test_db_servers]
testdb01  ansible_host=192.168.1.102 db_name=testdb  oracle_sid=TSTDB1

[prod_db_servers]
proddb01  ansible_host=192.168.1.103 db_name=proddb  oracle_sid=PRDDB1

[dev_grid_servers]
devgrid01   ansible_host=192.168.1.111 oracle_sid=+ASMDEV

[prod_grid_servers]
prodgrid01  ansible_host=192.168.1.113 oracle_sid=+ASMPRD

[prod_rac_nodes]
rac1 ansible_host=192.168.1.121 node_id=1 oracle_sid=RAC1
rac2 ansible_host=192.168.1.122 node_id=2 oracle_sid=RAC2

[dev_dataguard_servers]
devstd01   ansible_host=192.168.1.131 role=standby oracle_sid=DEVSTD
