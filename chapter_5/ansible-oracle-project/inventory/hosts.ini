[oracle_servers]
db1 ansible_host=db1 oracle_sid=ORCL oracle_home=/u01/app/oracle/product/19c
db2 ansible_host=db2 oracle_sid=TEST oracle_home=/u01/app/oracle/product/19c
db3 ansible_host=db3 oracle_sid=DEV  oracle_home=/u01/app/oracle/product/19c

[all:vars]
ansible_user=oracle
ansible_ssh_private_key_file=~/.ssh/id_rsa
