---
- name: Verify Oracle OS user account and primary group
  ansible.builtin.command: "id {{ oracle_user }}"
  register: oracle_id_out
  changed_when: false

- name: Create Oracle OS user limits configuration
  ansible.builtin.copy:
    dest: "{{ oracle_base }}/admin/oracle_security_limits.conf"
    content: |
      # Managed by Ansible role: oracle_user
      {{ oracle_user }} soft nofile 1024
      {{ oracle_user }} hard nofile 65536
      {{ oracle_user }} soft nproc 2047
      {{ oracle_user }} hard nproc 16384
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"

