---
- name: Ensure Oracle prerequisite base directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0755"
  loop:
    - "{{ oracle_base }}"
    - "{{ oracle_base }}/admin"
    - "{{ oracle_base }}/cfgtoollogs"

- name: Verify prerequisite kernel parameter simulation file
  ansible.builtin.copy:
    dest: "{{ oracle_base }}/admin/sysctl_oracle_prereq.conf"
    content: |
      # Managed by Ansible role: oracle_prereq
      kernel.shmmax = {{ oracle_shmmax }}
      kernel.shmall = {{ oracle_shmall }}
      fs.file-max = 6815744
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"

