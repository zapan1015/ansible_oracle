services:
  # 1. Ansible Control Node
  ansible-control:
    build:
      context: ./docker
      dockerfile: Dockerfile.control
    container_name: ansible-control-ch3
    hostname: ansible-control
    user: oracle
    working_dir: /home/oracle/ansible-oracle-adhoc
    environment:
      - ANSIBLE_CONFIG=/home/oracle/ansible-oracle-adhoc/ansible.cfg
      - ANSIBLE_CFG_IN_WORLD_WRITABLE_DIR=1
    volumes:
      - ./:/home/oracle/ansible-oracle-adhoc
      - shared-ssh-keys-ch3:/home/oracle/.ssh
    networks:
      ansible-net-ch3:
        ipv4_address: 192.168.3.10
    command: >
      bash -c "
        mkdir -p /home/oracle/.ssh &&
        if [ ! -f /home/oracle/.ssh/id_rsa ]; then
          ssh-keygen -t rsa -b 4096 -f /home/oracle/.ssh/id_rsa -N '' -q;
          chmod 600 /home/oracle/.ssh/id_rsa;
          chmod 644 /home/oracle/.ssh/id_rsa.pub;
        fi;
        chmod 755 /home/oracle/ansible-oracle-adhoc;
        chmod 644 /home/oracle/ansible-oracle-adhoc/ansible.cfg || true;
        echo 'Chapter 3 Ansible Control Node is ready.';
        tail -f /dev/null
      "

  # 2. Oracle Server (Dev)
  devdb:
    build:
      context: ./docker
      dockerfile: Dockerfile.oracle_node
    container_name: devdb
    hostname: devdb
    networks:
      ansible-net-ch3:
        ipv4_address: 192.168.3.101
    volumes:
      - shared-ssh-keys-ch3:/shared-keys:ro

  # 3. Oracle Server (Test)
  testdb:
    build:
      context: ./docker
      dockerfile: Dockerfile.oracle_node
    container_name: testdb
    hostname: testdb
    networks:
      ansible-net-ch3:
        ipv4_address: 192.168.3.102
    volumes:
      - shared-ssh-keys-ch3:/shared-keys:ro

  # 4. Oracle Server (Prod)
  proddb:
    build:
      context: ./docker
      dockerfile: Dockerfile.oracle_node
    container_name: proddb
    hostname: proddb
    networks:
      ansible-net-ch3:
        ipv4_address: 192.168.3.103
    volumes:
      - shared-ssh-keys-ch3:/shared-keys:ro

networks:
  ansible-net-ch3:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.3.0/24
          gateway: 192.168.3.1

volumes:
  shared-ssh-keys-ch3:
