---
# ========================================================
# Playbook: 02_setup_oracle_env.yml
# Description: Chapter 1 Master Project - Setup Oracle & Grid Base Directories
# ========================================================

# --------------------------------------------------------
# 1. 모든 노드: Oracle Base 및 Inventory 공통 디렉터리 생성
# --------------------------------------------------------
- name: Setup Common Oracle Base & Inventory Directories
  hosts: all
  become: yes
  gather_facts: no

  tasks:
    - name: Create Oracle base directory (/u01/app/oracle)
      ansible.builtin.file:
        path: "{{ oracle_base }}"
        state: directory
        owner: oracle
        group: oinstall
        mode: "{{ dir_mode | default('0755') }}"

    - name: Create Oracle Inventory directory (/u01/app/oraInventory)
      ansible.builtin.file:
        path: "{{ ora_inventory }}"
        state: directory
        owner: oracle
        group: oinstall
        mode: '0770'

    - name: Verify Oracle Base directory exists
      ansible.builtin.command: ls -ld {{ oracle_base }}
      register: oracle_base_check
      changed_when: false

    - name: Display Oracle Base status
      ansible.builtin.debug:
        msg: "[{{ inventory_hostname }}] Oracle Base: {{ oracle_base_check.stdout }}"

# --------------------------------------------------------
# 2. DB 서버 (db01, db02): Oracle Database 19c Home 생성
# --------------------------------------------------------
- name: Setup Oracle Database 19c Product Home on DB Nodes
  hosts: db_servers
  become: yes
  gather_facts: no

  tasks:
    - name: Create Oracle 19c product home directory
      ansible.builtin.file:
        path: "{{ oracle_home }}"
        state: directory
        owner: "{{ oracle_user | default('oracle') }}"
        group: oinstall
        mode: '0755'

    - name: Create Fast Recovery Area directory
      ansible.builtin.file:
        path: "{{ db_recovery_file_dest | default('/u01/app/oracle/fast_recovery_area') }}"
        state: directory
        owner: "{{ oracle_user | default('oracle') }}"
        group: oinstall
        mode: '0755'

    - name: Verify Oracle Home directory
      ansible.builtin.command: ls -ld {{ oracle_home }}
      register: oracle_home_check
      changed_when: false

    - name: Display Oracle Home details
      ansible.builtin.debug:
        msg: "[{{ inventory_hostname }}] Oracle Home: {{ oracle_home_check.stdout }}"

# --------------------------------------------------------
# 3. Grid 서버 (grid01): Oracle Grid Infrastructure 19c Home 생성
# --------------------------------------------------------
- name: Setup Oracle Grid Infrastructure 19c Home on Grid Nodes
  hosts: grid_servers
  become: yes
  gather_facts: no

  tasks:
    - name: Create Oracle 19c Grid home directory
      ansible.builtin.file:
        path: "{{ grid_home }}"
        state: directory
        owner: "{{ grid_user | default('grid') }}"
        group: oinstall
        mode: '0775'

    - name: Verify Grid Home directory
      ansible.builtin.command: ls -ld {{ grid_home }}
      register: grid_home_check
      changed_when: false

    - name: Display Grid Home details
      ansible.builtin.debug:
        msg: "[{{ inventory_hostname }}] Grid Home: {{ grid_home_check.stdout }}"
