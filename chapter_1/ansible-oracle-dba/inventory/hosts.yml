---
# ========================================================
# Oracle DBA Ansible Lab Inventory (YAML Format)
# Chapter 1: Basic & Master Project Setup (Oracle 19c RAC)
# ========================================================

all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    oracle_base: /u01/app/oracle
    grid_base: /u01/app/grid
    ora_inventory: /u01/app/oraInventory

  children:
    database_servers:
      children:
        db_servers:
          hosts:
            db01:
              ansible_host: 192.168.1.101
              ansible_user: oracle
              oracle_sid: ORCL1
            db02:
              ansible_host: 192.168.1.102
              ansible_user: oracle
              oracle_sid: ORCL2

        grid_servers:
          hosts:
            grid01:
              ansible_host: 192.168.1.103
              ansible_user: grid
              oracle_sid: +ASM1

    rac_nodes:
      hosts:
        db01:
          ansible_host: 192.168.1.101
          node_role: rac_instance_1
        db02:
          ansible_host: 192.168.1.102
          node_role: rac_instance_2
